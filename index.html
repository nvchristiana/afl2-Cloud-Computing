<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopMart VIP Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --sage-dark: #1b2e24;
      --sage-primary: #2d4a3e;
      --sage-accent: #52796f;
      --sage-light: #84a98c;
      --sage-bg: #cad2c5;
    }

    body {
      background: linear-gradient(135deg, #111e17 0%, #2d4a3e 50%, #1b2e24 100%);
      min-height: 100vh;
      color: #333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .main-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .title-header {
      color: var(--sage-dark);
      letter-spacing: 1px;
    }

    .btn-sage {
      background-color: var(--sage-primary);
      color: #fff;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-sage:hover {
      background-color: var(--sage-dark);
      color: #fff;
      transform: translateY(-2px);
    }

    .table-custom-dark {
      background-color: var(--sage-dark) !important;
      color: #ffffff !important;
    }

    .badge-seri {
      background-color: var(--sage-accent);
      color: #ffffff;
    }
  </style>
</head>
<body class="p-3 p-md-5">

  <div class="container main-card p-4 p-md-5 my-auto" style="max-width: 950px;">
    <div class="text-center mb-4">
      <h2 class="fw-bold title-header">POPMART VIP</h2>
      <p class="text-muted small">Inventory Management System</p>
    </div>
    
    <form id="itemForm" class="row g-3">
      <input type="hidden" id="keyId">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Figure Name</label>
        <input type="text" id="nama" class="form-control" placeholder="e.g. Skullpanda The Warmth" required>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">IP Series</label>
        <select id="seri" class="form-select" required>
          <option value="Skullpanda">Skullpanda</option>
          <option value="The Monsters (Labubu)">The Monsters (Labubu)</option>
          <option value="Space Molly">Space Molly</option>
          <option value="Dimoo">Dimoo</option>
          <option value="Hirono">Hirono</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Condition</label>
        <select id="kondisi" class="form-select">
          <option value="Sealed Box">Sealed Box</option>
          <option value="Opened Box (Foil Sealed)">Opened Box (Foil Sealed)</option>
          <option value="Unboxed">Unboxed</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Price (IDR)</label>
        <input type="number" id="harga" class="form-control" placeholder="285000" required>
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Stock</label>
        <input type="number" id="stok" class="form-control" placeholder="3" required>
      </div>
      <div class="col-12 text-end mt-4">
        <button type="button" class="btn btn-outline-secondary me-2" onclick="resetForm()">Reset</button>
        <button type="submit" class="btn btn-sage px-4" id="btnSubmit">Save Item</button>
      </div>
    </form>

    <hr class="my-4 text-secondary">

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-custom-dark">
          <tr>
            <th>Figure Name</th>
            <th>IP Series</th>
            <th>Condition</th>
            <th>Price</th>
            <th>Stock</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="listData"></tbody>
      </table>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqrn8TFCd8CKZ_vf8B-XNZLLU3GwyDfYw",
      authDomain: "cloud-youra.firebaseapp.com",
      databaseURL: "https://cloud-youra-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cloud-youra",
      storageBucket: "cloud-youra.firebasestorage.app",
      messagingSenderId: "1025957040658",
      appId: "1:1025957040658:web:21cd71793799956920fecb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('popmart_items');

    const form = document.getElementById('itemForm');
    const tbody = document.getElementById('listData');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('keyId').value;
      const payload = {
        nama: document.getElementById('nama').value,
        seri: document.getElementById('seri').value,
        kondisi: document.getElementById('kondisi').value,
        harga: Number(document.getElementById('harga').value),
        stok: Number(document.getElementById('stok').value)
      };

      if (id) {
        db.child(id).update(payload, () => resetForm());
      } else {
        db.push(payload, () => resetForm());
      }
    });

    db.on('value', (snapshot) => {
      tbody.innerHTML = '';
      snapshot.forEach((child) => {
        const item = child.val();
        const key = child.key;
        tbody.innerHTML += `
          <tr>
            <td class="fw-bold text-dark">${item.nama}</td>
            <td><span class="badge badge-seri">${item.seri}</span></td>
            <td><small class="text-muted">${item.kondisi}</small></td>
            <td class="fw-semibold">Rp ${item.harga.toLocaleString('id-ID')}</td>
            <td>${item.stok}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-warning me-1" onclick="editItem('${key}', '${item.nama}', '${item.seri}', '${item.kondisi}', ${item.harga}, ${item.stok})">Edit</button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteItem('${key}')">Delete</button>
            </td>
          </tr>
        `;
      });
    });

    function editItem(key, nama, seri, kondisi, harga, stok) {
      document.getElementById('keyId').value = key;
      document.getElementById('nama').value = nama;
      document.getElementById('seri').value = seri;
      document.getElementById('kondisi').value = kondisi;
      document.getElementById('harga').value = harga;
      document.getElementById('stok').value = stok;
      document.getElementById('btnSubmit').innerText = 'Update Item';
    }

    function deleteItem(key) {
      if (confirm('Are you sure you want to delete this item?')) {
        db.child(key).remove();
      }
    }

    function resetForm() {
      form.reset();
      document.getElementById('keyId').value = '';
      document.getElementById('btnSubmit').innerText = 'Save Item';
    }
  </script>
</body>
</html>
